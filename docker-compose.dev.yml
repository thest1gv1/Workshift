# Local development services. Next.js runs separately with npm run dev.
name: workshift

services:
  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_DB: workshift
      POSTGRES_USER: workshift
      # Local development credentials only.
      POSTGRES_PASSWORD: workshift_local
    ports:
      - '127.0.0.1:5433:5432'
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U workshift -d workshift']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '127.0.0.1:6380:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  redis_data:
